name: EV6 upstream sync

on:
  schedule:
    # Offset from the hour to reduce peak-time scheduling delays (UTC).
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      replay_web:
        description: Replay the November web conflict without publishing or merging
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ev6-upstream-sync
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'huukuujuu/openpilot' && !inputs.replay_web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    outputs:
      recover: ${{ steps.prepare.outputs.recover }}
      ready: ${{ steps.prepare.outputs.ready }}
      pr: ${{ steps.prepare.outputs.pr }}
      merge_sha: ${{ steps.prepare.outputs.merge_sha }}
      merge_tree: ${{ steps.prepare.outputs.merge_tree }}
      base_sha: ${{ steps.prepare.outputs.base_sha }}
      source_sha: ${{ steps.prepare.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: carrot-ev6
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check upstream and prepare integration PR
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/upstream_sync/sync.py prepare
      - name: Preserve merge/conflict report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-sync-report
          path: upstream-sync-report.json
          if-no-files-found: ignore

  validate:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yaml
    with:
      run_number: upstream-sync
      checkout_ref: ${{ needs.prepare.outputs.base_sha }}
      merge_source: ${{ needs.prepare.outputs.source_sha }}
      merge_tree: ${{ needs.prepare.outputs.merge_tree }}
      merge_commit: ${{ needs.prepare.outputs.merge_sha }}

  automation_checks:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reconstruct exact integration commit
        env:
          MERGE_SOURCE: ${{ needs.prepare.outputs.source_sha }}
          MERGE_TREE: ${{ needs.prepare.outputs.merge_tree }}
          MERGE_COMMIT: ${{ needs.prepare.outputs.merge_sha }}
        run: >-
          python tools/upstream_sync/sync.py checkout
          --source "$MERGE_SOURCE" --tree "$MERGE_TREE" --merge "$MERGE_COMMIT"
      - run: python -m unittest discover -s tools/upstream_sync -p 'test_*.py' -v

  merge:
    needs: [prepare, validate, automation_checks]
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The merge controller comes from the workflow revision, not the proposed
      # upstream merge. Candidate code never receives this job's write token.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Merge only the tested, still-current PR
        env:
          GITHUB_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr }}
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          MERGE_SHA: ${{ needs.prepare.outputs.merge_sha }}
        run: >-
          python tools/upstream_sync/sync.py finish
          --pr "$PR_NUMBER" --base "$BASE_SHA"
          --source "$SOURCE_SHA" --merge "$MERGE_SHA"

  rebuild_web:
    needs: prepare
    if: needs.prepare.outputs.recover == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      BASE: ${{ needs.prepare.outputs.base_sha }}
      SOURCE: ${{ needs.prepare.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python tools/upstream_sync/recover_web.py rebuild
        env:
          ARTIFACT: ${{ runner.temp }}/ev6-web-files
      - uses: actions/upload-artifact@v4
        with:
          name: ev6-web-files
          path: ${{ runner.temp }}/ev6-web-files
          if-no-files-found: error

  publish_web:
    needs: [prepare, rebuild_web]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      candidate: ${{ steps.publish.outputs.candidate }}
      pr: ${{ steps.publish.outputs.pr }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ev6-web-files
          path: ${{ runner.temp }}/ev6-web-files
      - id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
          ARTIFACT: ${{ runner.temp }}/ev6-web-files
          BASE: ${{ needs.prepare.outputs.base_sha }}
          SOURCE: ${{ needs.prepare.outputs.source_sha }}
        run: python tools/upstream_sync/recover_web.py publish

  validate_web:
    needs: publish_web
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yaml
    with:
      checkout_ref: ${{ needs.publish_web.outputs.candidate }}
      run_number: upstream-web-recovery

  check_web_sync:
    needs: publish_web
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.publish_web.outputs.candidate }}
          persist-credentials: false
      - run: python -m unittest discover -s tools/upstream_sync -p 'test_*.py'

  merge_web:
    needs: [prepare, publish_web, validate_web, check_web_sync]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - env:
          BASE: ${{ needs.prepare.outputs.base_sha }}
          SOURCE: ${{ needs.prepare.outputs.source_sha }}
          CANDIDATE: ${{ needs.publish_web.outputs.candidate }}
          PR: ${{ needs.publish_web.outputs.pr }}
          GITHUB_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
        run: python tools/upstream_sync/recover_web.py finish

  replay_web:
    if: github.repository == 'huukuujuu/openpilot' && inputs.replay_web
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m unittest discover -s tools/upstream_sync -p 'test_*.py'
      - name: Reproduce the known-good November integration tree
        env:
          PYTHONPATH: tools/upstream_sync
          ARTIFACT: ${{ runner.temp }}/replay-web
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from recover_web import git, rebuild, reconstruct
          base, source = "8e521bad6da6767eafc62ebfca4da24d084f867d", "6a9225b541f4777b7202ec49abd8b80d7a78b9ba"
          directory = Path(os.environ["ARTIFACT"])
          rebuild(base, source, directory)
          commit = reconstruct(base, source, directory)
          expected = git("rev-parse", "7e68a419194583824242bfde4bf73522fd33563d^{tree}").stdout
          if git("rev-parse", commit + "^{tree}").stdout != expected:
            raise SystemExit("Rebuilt tree differs from the independently validated merge")
          PY
